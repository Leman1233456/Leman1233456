# Server Configuration
server.port=8080

# Database Configuration (H2 in-memory database)
spring.datasource.url=jdbc:h2:mem:todoapp
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
todoapp.jwtSecret=todoAppSecretKey123456789012345678901234567890
todoapp.jwtExpirationMs=86400000

# Logging Configuration
logging.level.com.todoapp.backend=DEBUG
logging.level.org.springframework.security=DEBUG

# Jackson Configuration
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
